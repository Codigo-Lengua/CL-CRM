name: Etiquetar PR

# Asigna la etiqueta según el prefijo de la rama (docs/flujo-de-trabajo.md §4).
# pull_request_target sin checkout: solo usa la API de etiquetas.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const rama = context.payload.pull_request.head.ref;
            const etiquetas = {
              "feature/": "mejora",
              "fix/": "bug",
              "hotfix/": "bug",
              "docs/": "documentacion",
              "diseno/": "diseno",
            };
            const prefijo = Object.keys(etiquetas).find((p) => rama.startsWith(p));
            if (!prefijo) {
              core.info(`La rama ${rama} no tiene prefijo conocido; sin etiqueta automática.`);
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [etiquetas[prefijo]],
            });
